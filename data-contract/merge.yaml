# Input for merge_schemas.py: which per-table contracts to merge into one ODCS contract and
# everything that is written by hand. The descriptions, keys and relationships are already in the
# per-table contracts, put there by enrich_schemas.py. Paths are relative to this file, except
# `server.path`, which `datacontract test` resolves from the directory it is run in (the
# repository root).

# Any ODCS top-level field; set on the merged contract on every run. The fields the importer
# fills (version, status, apiVersion, ...) are kept from the first merged table unless set here.
contract:
  id: synthea-ms-data
  name: Synthea MS Data
  domain: clinical
  status: draft
  description:
    purpose: Synthetic patient, encounter, condition and observation data of a multiple sclerosis (MS) cohort, generated with Synthea.
    usage: Pipeline development and testing of MS data products.
    limitations: Synthetic data. Not for clinical or research conclusions.
  tags:
    - synthea
    - multiple-sclerosis
    - MS

output: tmp/synthea-ms-data.odcs.yaml

# One `local` CSV server for all tables; `datacontract test` replaces {model} with the table name.
server:
  name: local
  path: data/csv/{model}.csv

# Folder with the per-table contracts (<table>.yaml), written by `datacontract import csv` and
# enriched by enrich_schemas.py
imports: tmp

# Tables to merge, in this order
tables:
  - patients
  - encounters
  - conditions
  - observations

# Hand-written fields, applied last so they win over the importer and the dictionary. This is the
# domain knowledge of this dataset, which neither the CSV nor the Synthea wiki carries.
# `<table>` sets fields on the schema object, `<table>.<COLUMN>` on the column; `null` removes a field.
overrides:
  conditions.CODE:
    description: SNOMED CT code of the condition. Multiple sclerosis is 24700007.
  conditions:
    quality:
      - type: sql
        description: Every condition belongs to a patient in the patients table.
        query: SELECT COUNT(*) FROM conditions WHERE PATIENT NOT IN (SELECT Id FROM patients)
        mustBe: 0
